server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  cloud:
    openfeign:
      client:
        config:
          # 주문 클라이언트: 기본값(연결 10초/읽기 60초)이면 단일 WS 스레드가 장시간 멈춤 → 짧게 제한
          # 읽기 타임아웃 시 결과 불명확 → TradeService가 orderLinkId로 주문 상태 조회
          tradeClient:
            connect-timeout: 3000
            read-timeout: 5000

binance:
  api:
    url: https://fapi.binance.com   # 데모: https://demo-fapi.binance.com
    recv-window: 5000
  websocket:
    url: wss://fstream.binance.com/market/ws   # 데모: wss://demo-fstream.binance.com/market/ws (경로 확인 필요)
    # 개인(user data) 스트림 접속 주소. {listenKey} 자리에 발급받은 키가 들어감 (데모: wss://demo-fstream.binance.com/private/ws/{listenKey})
    # ※ 공식 문서상 형식이 두 가지라 실제 접속 주소 형식이 다를 수 있음 → 이벤트가 오지 않으면 아래 형식으로 교체
    #   wss://fstream.binance.com/private/ws?listenKey={listenKey}&events=ORDER_TRADE_UPDATE/listenKeyExpired
    private-url: wss://fstream.binance.com/private/ws/{listenKey}
    # [사용자 정책 2026-10-28] listenKey 연장 주기 30분 (유효기간 60분)
    listen-key-keepalive: 1800000
    reconnect-delay: 1000
    reconnect-max-delay: 30000

bybit:
  api:
    url: https://api.bybit.com
    recv-window: 5000
  websocket:
    url: wss://stream.bybit.com/v5/public/linear
    private-url: wss://stream.bybit.com/v5/private
    ping-interval: 20000
    reconnect-delay: 1000
    reconnect-max-delay: 30000
