<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/_resources/css/style.css}">
    <script th:src="@{/_resources/js/jquery-4.0.0.min.js}"></script>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">회원가입</h2>

        <div th:if="${error}" class="auth-message auth-error" th:text="${error}"></div>

        <form class="auth-form" method="post" action="/signup">
            <div class="auth-field">
                <label for="username">이름</label>
                <input type="text" id="username" name="username"
                       placeholder="이름" required
                       th:value="${request?.username}">
            </div>
            <div class="auth-field">
                <label for="phoneNumber">휴대폰 번호</label>
                <input type="text" id="phoneNumber" name="phoneNumber"
                       placeholder="휴대폰 번호" required
                       th:value="${request?.phoneNumber}">
            </div>
            <div class="auth-field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password"
                       placeholder="비밀번호" required>
            </div>
            <div class="auth-field">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm"
                       placeholder="비밀번호 확인" required>
            </div>
            <div class="auth-field">
                <label for="passwordConfirm">이메일</label>
                <input type="text" id="email" name="email"
                       placeholder="이메일" required>
            </div>
            <!-- 거래소 목록·표시명은 구현이 끝난 거래소(컨트롤러 exchangeTypes) 기준 (최초 라벨은 첫 거래소, 선택값과 다르면 아래 스크립트가 맞춤) -->
            <div class="auth-field">
                <label for="exchangeType">거래소</label>
                <select id="exchangeType" name="exchangeType">
                    <option th:each="type, stat : ${exchangeTypes}"
                            th:value="${type.name()}"
                            th:attr="data-label=${type.displayName}"
                            th:text="${type.displayName}"
                            th:selected="${request?.exchangeType == type.name() or (request?.exchangeType == null and stat.first)}"></option>
                </select>
            </div>
            <div class="auth-field">
                <label for="apiKey"><span id="apiKeyLabel" th:text="${exchangeTypes[0].displayName}"></span> API Key</label>
                <input type="text" id="apiKey" name="apiKey"
                       th:placeholder="${exchangeTypes[0].displayName + ' API Key'}" required
                       th:value="${request?.apiKey}">
            </div>
            <div class="auth-field">
                <label for="apiSecret"><span id="apiSecretLabel" th:text="${exchangeTypes[0].displayName}"></span> API Secret</label>
                <input type="password" id="apiSecret" name="apiSecret"
                       th:placeholder="${exchangeTypes[0].displayName + ' API Secret'}" required>
            </div>
            <div class="auth-buttons">
                <button type="submit" class="auth-btn auth-btn-primary">가입하기</button>
                <a href="/login" class="auth-btn auth-btn-secondary">돌아가기</a>
            </div>
        </form>
    </div>
</div>
<script>
    // 거래소 선택 시 API Key/Secret 라벨 및 플레이스홀더 동적 변경 (표시명은 option 의 data-label)
    $('#exchangeType').on('change', function () {
        const label = $(this).find(':selected').data('label') || $(this).val();
        $('#apiKeyLabel, #apiSecretLabel').text(label);
        $('#apiKey').attr('placeholder', label + ' API Key');
        $('#apiSecret').attr('placeholder', label + ' API Secret');
    }).trigger('change');   // 가입 실패로 다시 열린 경우 선택값 기준으로 라벨 동기화
</script>
</body>
</html>
