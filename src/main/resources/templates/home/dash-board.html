<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>코인목록</title>
    <link rel="stylesheet" th:href="@{/_resources/css/style.css}">
    <script th:src="@{/_resources/js/jquery-4.0.0.min.js}"></script>
</head>
<body>
<div th:replace="~{fragments/header :: walletHeader}"></div>
<div class="market-overview-container">
    <div class="dashboard-header">
        <h1>실시간 코인 목록</h1>
        <input type="text" id="coin-search" class="coin-search-input" placeholder="코인 검색 (예: BTC, ETH)">
        <a href="/mypage" class="mypage-link">마이페이지</a>
    </div>

    <div class="table-wrapper dashboard-scroll-wrapper" id="dashboard-scroll-wrapper">
        <table class="market-table">
            <thead>
            <tr>
                <th>Symbol</th>
                <th>Base Coin</th>
                <th>Last Price</th>
                <th>24h Change</th>
                <th>24h High</th>
                <th>24h Low</th>
                <th>24h Volume</th>
            </tr>
            </thead>
            <tbody id="coin-list-body">
            <!-- JS로 코인 목록을 동적 렌더링 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let allCoins = [];             // 전체 코인 데이터 캐시

    /**
     * 코인 행(row) HTML을 생성한다.
     */
    function createCoinRow(coin) {
        const tr = document.createElement('tr');
        tr.onclick = () => window.location.href = '/chart?symbol=' + coin.symbol;
        tr.style.cursor = 'pointer';

        const pricePcnt = parseFloat(coin.price24hPcnt);
        const isNegative = coin.price24hPcnt.startsWith('-');
        const colorClass = isNegative ? 'text-red' : 'text-green';
        const percentStr = (pricePcnt * 100).toFixed(2) + '%';
        const displayPercent = (pricePcnt > 0 ? '+' : '') + percentStr;
        const volume = parseFloat(coin.volume24h).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

        tr.innerHTML = `
            <td>
                <div class="symbol-info">
                    <span class="symbol-text">${coin.formattedSymbol}</span>
                </div>
            </td>
            <td>${coin.baseCoin}</td>
            <td class="price">${coin.lastPrice}</td>
            <td class="${colorClass}">${displayPercent}</td>
            <td>${coin.highPrice24h}</td>
            <td>${coin.lowPrice24h}</td>
            <td>${volume}</td>
        `;
        return tr;
    }

    /**
     * 검색어에 따라 필터링된 코인 목록을 렌더링한다.
     * 1초마다 호출되며, 스크롤 위치를 유지하면서 데이터를 갱신한다.
     */
    function renderCoins() {
        const tbody = document.getElementById('coin-list-body');
        const wrapper = document.getElementById('dashboard-scroll-wrapper');
        const scrollTop = wrapper.scrollTop; // 스크롤 위치 저장

        // 검색어로 필터링 (대소문자 무시, LIKE 방식)
        const keyword = ($('#coin-search').val() || '').toLowerCase();
        const filtered = allCoins.filter(coin => {
            if (!keyword) return true;
            return coin.symbol.toLowerCase().includes(keyword)
                || coin.baseCoin.toLowerCase().includes(keyword);
        });

        tbody.innerHTML = '';

        filtered.forEach(coin => {
            tbody.appendChild(createCoinRow(coin));
        });

        wrapper.scrollTop = scrollTop; // 스크롤 위치 복원
    }

    /**
     * 헤더에서 선택한 거래소의 전체 코인 목록을 가져와 캐시에 저장하고 렌더링한다.
     */
    function updateCoinList() {
        $.ajax({
            url: '/api/tickers',
            method: 'GET',
            data: { exchange: getExchange() },
            success: function(data) {
                // 응답: 거래대금 내림차순 티커 배열
                if (Array.isArray(data)) {
                    allCoins = data;
                    renderCoins();
                }
            },
            error: function(xhr) {
                console.error('Error fetching tickers:', xhr.status);
            }
        });
    }

    // 헤더에서 거래소 변경 시 즉시 다시 조회
    $(document).on('exchangeChanged', updateCoinList);

    // 검색어 입력 시 즉시 필터링
    $(document).on('input', '#coin-search', function() {
        renderCoins();
    });

    // 페이지 로드 시 거래소 확정 후 초기화 및 1초 간격 갱신
    document.addEventListener('DOMContentLoaded', function() {
        whenExchangeReady(function() {
            updateCoinList();
            setInterval(updateCoinList, 1000);
        });
    });
</script>
</body>
</html>
